name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev
          pip install --upgrade buildozer
      - name: Initialize Buildozer
        run: |
          buildozer init
          sed -i "s/#title = My Application/title = MyPythonApp/" buildozer.spec
          sed -i "s/#package.name = myapp/package.name = mypythonapp/" buildozer.spec
          sed -i "s/#package.domain = org.test/package.domain = org.test/" buildozer.spec
          sed -i "s/#source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py/" buildozer.spec
          sed -i "s/#requirements = python3,kivy/requirements = python3/" buildozer.spec
      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
